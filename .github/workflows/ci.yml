name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -warnaserror
      - run: dotnet test -c Release --no-build

  # Builds the real image (API + the mirror-magic UI) and checks that it starts and serves.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: adikeshri/mirror-magic
          path: mirror-magic
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: ui=./mirror-magic
          load: true
          push: false
          tags: mira:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mira -p 5080:5080 mira:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5080/health
          curl -fsS http://127.0.0.1:5080/ | grep -qi "<html"
          curl -fsS http://127.0.0.1:5080/api/config | grep -q '"units"'
      - name: Container logs on failure
        if: failure()
        run: docker logs mira
