services:
  mira:
    build:
      context: .
      additional_contexts:
        # The UI is built into the image from this folder, so `git pull` there too. To always build the latest UI from GitHub
        # instead, set UI_CONTEXT=https://github.com/adikeshri/mirror-magic.git#main
        ui: ${UI_CONTEXT:-../mirror-magic}
    image: mira
    restart: unless-stopped
    ports:
      # Loopback only: the mirror's own browser is the only client it needs.
      # Use "5080:5080" to reach it from other devices on your network.
      - "127.0.0.1:5080:5080"
    volumes:
      - ./config.json:/config/config.json:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
